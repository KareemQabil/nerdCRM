# IOETI local development infrastructure.
# Only PostgreSQL runs in Docker; Axelor runs from source via Gradle (scripts/run-app.sh).
# Port is bound to 127.0.0.1 only. Credentials come from ../.env (never committed).
name: ioeti-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: ioeti-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${IOETI_DB_NAME:?set IOETI_DB_NAME in .env}
      POSTGRES_USER: ${IOETI_DB_USER:?set IOETI_DB_USER in .env}
      POSTGRES_PASSWORD: ${IOETI_DB_PASSWORD:?set IOETI_DB_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    ports:
      - "127.0.0.1:${IOETI_DB_PORT:-5433}:5432"
    volumes:
      - ioeti_dev_pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  ioeti_dev_pgdata:
    name: ioeti_dev_pgdata
