# IOETI overrides for Axelor Open Platform settings.
# Rendered by scripts/dev-env.sh into .local/axelor-config.local.properties (git-ignored)
# and passed to Axelor with `gradlew run --config`. The upstream file
# axelor-app/src/main/resources/axelor-config.properties is NOT modified.
#
# Placeholders: @@NAME@@ are replaced from .env.

db.default.url = jdbc:postgresql://@@IOETI_DB_HOST@@:@@IOETI_DB_PORT@@/@@IOETI_DB_NAME@@
db.default.user = @@IOETI_DB_USER@@
db.default.password = @@IOETI_DB_PASSWORD@@
db.default.ddl = update

application.name = IOETI Business Operating System
application.description = IOETI Egypt - development build on Axelor Open Suite
application.mode = dev
application.locale = @@IOETI_LOCALE@@

encryption.password = @@IOETI_ENCRYPTION_PASSWORD@@
encryption.bankorder.password = @@IOETI_BANKORDER_ENCRYPTION_PASSWORD@@

data.upload.dir = @@IOETI_DATA_DIR@@/attachments
data.upload.temp-dir = @@IOETI_DATA_DIR@@/tmp
data.upload.max-size = 20
reports.design-dir = @@IOETI_DATA_DIR@@/reports

logging.path = @@IOETI_LOG_DIR@@
logging.level.root = WARN
logging.level.com.axelor = INFO
logging.level.com.ioeti = DEBUG

# --- security (SEC-002 / SEC-004) -------------------------------------------------------------
# Environment variables AXELOR_CONFIG_<KEY with _ for .> override these values (used by CI).
session.timeout = 60
# REQUIRED on staging/production (HTTPS only): Secure session/CSRF cookies.
# session.cookie.secure = true
# Generic Axelor APIs (/ws/rest, /ws/action, ...) are open only to these groups (and admin).
ioeti.security.generic-api = restricted
ioeti.security.maintenance-groups = admins
# Login throttling: failures per window (minutes) per address, and per username+address.
ioeti.security.login.window = 15
ioeti.security.login.ip.max = 20
ioeti.security.login.user.max = 5
# Reverse proxies whose X-Forwarded-For is trusted (comma-separated addresses); none by default.
ioeti.security.trusted.proxies =
