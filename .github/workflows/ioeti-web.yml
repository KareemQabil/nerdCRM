name: IOETI custom UI
on:
  pull_request:
    paths:
      - "apps/ioeti-web/**"
      - ".github/workflows/ioeti-web.yml"
  push:
    paths:
      - "apps/ioeti-web/**"
      - ".github/workflows/ioeti-web.yml"
jobs:
  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/ioeti-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and build
        run: npm run build
