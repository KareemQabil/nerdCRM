# In-memory HSQLDB used by IOETI JPA tests (schema created from all entities on the test classpath).
application.name = IOETI business lines tests
application.description = Tests
application.mode = dev
db.test.driver = org.hsqldb.jdbc.JDBCDriver
db.test.ddl = create
db.test.url = jdbc:hsqldb:mem:test
db.test.user = sa
db.test.password =
jakarta.persistence.sharedCache.mode = ENABLE_SELECTIVE
session.timeout = 60
data.upload.dir = {java.io.tmpdir}/.axelor/test-attachments
data.upload.max-size = 5
quartz.enable = false
# Enables the AOS @HttpExceptionHandler interceptor exercised by OpportunityConflictTest.
utils.api.enable = true
