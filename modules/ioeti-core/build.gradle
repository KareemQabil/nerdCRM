plugins {
	id 'com.axelor.app'
}

apply from: new File(projectDir.canonicalFile, "../../gradle/ioeti-module.gradle")

// IOETI shared kernel: root menu, Arabic text utilities, shared conventions.
// Depends only on axelor-base so every IOETI bounded context can build on it.
axelor {
	title "IOETI Core"
	description "IOETI shared kernel (menus, Arabic foundation, shared utilities)"
}

dependencies {
	api project(":modules:axelor-base")
	// WebSocket API (2.1, Tomcat 10.1) for WebSocketSessionGuard; provided at runtime by the container
	// (Session, CloseReason and OnMessage are in the client API since WebSocket 2.1)
	compileOnly "jakarta.websocket:jakarta.websocket-api:2.1.1"
	compileOnly "jakarta.websocket:jakarta.websocket-client-api:2.1.1"
	testImplementation "jakarta.websocket:jakarta.websocket-api:2.1.1"
	testImplementation "jakarta.websocket:jakarta.websocket-client-api:2.1.1"
}
