plugins {
	id 'com.axelor.app'
}

apply from: new File(projectDir.canonicalFile, "../../gradle/ioeti-module.gradle")

// IOETI commercial chain (Wave 3): catalog read, quotations from opportunities, and later approvals,
// contracts, milestones and handover. Built on the native AOS sale/contract/project modules.
axelor {
	title "IOETI Commercial"
	description "IOETI commercial chain on native Axelor sales objects"
}

apply from: rootProject.file("modules/axelor-open-suite/libs.gradle")

dependencies {
	api project(":modules:ioeti-core")
	api project(":modules:ioeti-business-lines")
	api project(":modules:axelor-sale")
	// payment milestones are the native supplychain Timetable on SaleOrder (Wave 3 part 2)
	api project(":modules:axelor-supplychain")
	// customer contracts are the native axelor-contract Contract (Wave 3 part 2b)
	api project(":modules:axelor-contract")

	implementation libs.swagger_jaxrs
}
