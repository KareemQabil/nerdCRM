plugins {
	id 'com.axelor.app'
}

apply from: new File(projectDir.canonicalFile, "../../gradle/ioeti-module.gradle")

// IOETI fundraising and partnerships (Wave 4E): donor profiles on native partners, grants and
// pledges, commitments, payment schedules, collections, deliverables and stewardship. A native sales
// opportunity is not a grants system, so this is a new bounded context; native marketing campaigns
// are reused for attribution. Receipts, restricted-fund accounting, invoices and posting wait for
// D-05 and D-06.
axelor {
	title "IOETI Fundraising"
	description "IOETI fundraising: donors, grants, pledges, schedules, collections, stewardship"
}

apply from: rootProject.file("modules/axelor-open-suite/libs.gradle")

dependencies {
	api project(":modules:ioeti-core")
	// fundraising opportunities are attributed to native marketing campaigns
	api project(":modules:axelor-marketing")

	implementation libs.swagger_jaxrs
}
